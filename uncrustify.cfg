# uncrustify config for the pxtone sources.
#
# The code is hand-aligned in columns (matching arguments, operators and
# semicolons across neighbouring lines). No formatter reproduces that, so this
# config is deliberately conservative: it normalises indentation and trailing
# whitespace and otherwise leaves the spacing inside a line exactly as written.
#
#   uncrustify -c uncrustify.cfg -l CPP --no-backup <files>
#   uncrustify -c uncrustify.cfg -l CPP --check <files>     # report only

# --- files
newlines            = auto      # keep each file's CRLF / LF
utf8_bom            = ignore    # keep the BOM where a file has one

# --- indentation: tabs, 4 columns
input_tab_size      = 4
output_tab_size     = 4
indent_columns      = 4
indent_with_tabs    = 2         # tabs to indent, existing alignment after it untouched
indent_label        = 1         # "term:" style labels stay in column 1
indent_access_spec  = 0
indent_comment      = false
indent_align_assign = false
indent_align_paren  = false
indent_relative_single_line_comments = true
cmt_indent_multi    = false

# --- keep hand alignment: never squeeze or rewrite spacing inside a line
align_keep_extra_space  = true
align_keep_tabs         = true
sp_skip_vbrace_tokens   = true  # keeps the padding in "else        stmt;"
sp_after_type           = ignore
sp_before_semi          = ignore
sp_after_semi           = ignore
sp_after_semi_for       = ignore
sp_before_comma         = ignore
sp_paren_comma          = ignore
sp_before_case_colon    = ignore
sp_return               = ignore
sp_not                  = ignore
sp_inv                  = ignore
sp_addr                 = ignore
sp_member               = ignore
sp_deref                = ignore
sp_sign                 = ignore
sp_incdec               = ignore
sp_before_nl_cont       = ignore
sp_before_emb_cmt       = ignore
sp_after_emb_cmt        = ignore
sp_enum_brace           = ignore
sp_pp_concat            = ignore
sp_angle_shift          = ignore
sp_before_vardef_square = ignore
sp_after_constr_colon   = ignore
sp_before_constr_colon  = ignore
sp_super_paren          = ignore
sp_this_paren           = ignore
sp_word_brace_ns        = ignore

# --- keep one-liners ("if( x ){ a; b; }", "case 0: x = 1; break;") on one line
nl_assign_leave_one_liners = true
nl_class_leave_one_liners  = true
nl_enum_leave_one_liners   = true
nl_getset_leave_one_liners = true
nl_func_leave_one_liners   = true
nl_if_leave_one_liners     = true
nl_while_leave_one_liners  = true
nl_do_leave_one_liners     = true
nl_for_leave_one_liners    = true

# --- optional: actively align new code. Left off because on the existing
# sources these re-align blocks that are already aligned by a different rule
# (about a quarter more lines change). Enable when formatting fresh code only.
#align_assign_span                = 1
#align_var_def_span               = 1
#align_same_func_call_params      = true
#align_same_func_call_params_span = 1
#align_func_proto_span            = 1
#align_number_right               = true
